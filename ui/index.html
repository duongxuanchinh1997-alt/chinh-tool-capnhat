<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CT TOOLS</title>
<style>
  :root{
    /* ---- THAN CHÌ + XANH CẨM THẠCH TRẦM (dịu mắt, không lóa) ---- */
    --bg:#15191c;         /* nền than chì trung tính */
    --bg2:#1a1f23;        /* sidebar */
    --panel:#1e2429;      /* thẻ */
    --panel2:#171b1f;     /* nền bảng */
    --line:#2b3339;
    --line2:#3a444b;
    --txt:#d5dcdf;        /* chữ xám sáng, KHÔNG trắng tinh */
    --txt2:#eef3f4;
    --muted:#8b989e;
    --acc:#5aa899;        /* xanh cẩm thạch trầm */
    --acc-hi:#79c2b2;
    --acc2:#3f7f74;
    --acc-soft:#22322f;
    --ok:#6fae86; --warn:#c49a55; --danger:#c07a6d;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--txt);
    font:13px/1.5 "Segoe UI",system-ui,sans-serif;
    overflow:hidden; user-select:none; -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;height:100vh}
  svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;
        stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  /* ---------------- SIDEBAR ---------------- */
  .side{
    width:218px;flex:0 0 218px;background:var(--bg2);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
    transition:width .16s ease, flex-basis .16s ease;
  }
  .side.mini{width:60px;flex-basis:60px}
  .side.mini .brand h1,.side.mini .brand p,.side.mini .cat,
  .side.mini .nav button span.lb,.side.mini .side-foot .lbl,.side.mini .ver{display:none}
  .side.mini .logo{width:40px;height:40px}
  .side.mini .nav button{justify-content:center;padding:11px 0}

  .brand{padding:16px 12px 10px;text-align:center}
  .logo{width:76px;height:76px;margin:0 auto;display:block;transition:.16s}
  .brand h1{font-size:15px;margin:9px 0 2px;letter-spacing:2.4px;font-weight:600;color:var(--txt2)}
  .brand p{font-size:10px;color:var(--muted);margin:0;letter-spacing:.5px}
  .side hr{border:0;border-top:1px solid var(--line);margin:11px 14px}
  .cat{font-size:9.5px;letter-spacing:1.5px;color:var(--muted);padding:0 16px 6px}

  .nav{flex:1;overflow-y:auto;padding:0 8px}
  .nav button{
    width:100%;display:flex;align-items:center;gap:10px;
    background:none;border:0;color:var(--muted);text-align:left;
    padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px;letter-spacing:.3px;
    transition:.13s;
  }
  .nav button:hover{background:#232a2f;color:var(--txt)}
  .nav button.on{background:var(--acc-soft);color:var(--txt2);box-shadow:inset 2px 0 0 var(--acc)}
  .nav button.on svg{color:var(--acc-hi)}

  .side-foot{padding:10px 12px 12px;text-align:center}
  .side-foot button{
    width:100%;margin-bottom:7px;padding:8px;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid var(--line2);background:#232a2f;color:var(--muted);font:inherit;font-size:11px;
    transition:.13s;
  }
  .side-foot button:hover{background:#2a3339;color:var(--txt);border-color:var(--acc2)}
  .ver{font-size:9px;color:#6b777c;margin-top:3px}

  /* ---------------- MAIN ---------------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{
    height:40px;flex:0 0 40px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:0 12px;
    font-size:12px;color:var(--muted);background:var(--bg2);
  }
  .top .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .top .sp{flex:1}
  .iconbtn{
    background:#232a2f;border:1px solid var(--line2);color:var(--muted);
    border-radius:7px;padding:5px 9px;cursor:pointer;font:inherit;font-size:11px;transition:.13s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .iconbtn:hover{color:var(--txt);border-color:var(--acc2);background:#2a3339}
  .kbd{border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-size:9.5px;opacity:.8}
  .body{flex:1;overflow-y:auto;padding:12px 14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  @media (max-width:980px){.grid{grid-template-columns:1fr}}

  .recent{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap}
  .recent b{font-size:9.5px;letter-spacing:1.2px;color:var(--muted);font-weight:600}
  .chip{
    background:#232a2f;border:1px solid var(--line2);border-radius:14px;
    padding:4px 11px;font-size:11px;cursor:pointer;color:var(--muted);transition:.13s;
  }
  .chip:hover{border-color:var(--acc2);color:var(--txt)}
  .chip.pin{border-color:var(--acc2);background:var(--acc-soft);color:var(--acc-hi)}

  /* ---------------- ACCORDION NHÓM TÁC VỤ ---------------- */
  .acc-bar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:11px;padding:6px 12px;background:#1a2024;
    border:1px solid var(--line);border-radius:8px;font-size:11.5px;color:var(--muted);
  }
  .acc-bar-actions{display:flex;gap:6px}
  .acc-bar-actions button{
    background:#232a2f;border:1px solid var(--line2);border-radius:6px;
    color:var(--txt);padding:3px 9px;font-size:11px;cursor:pointer;transition:.12s;
  }
  .acc-bar-actions button:hover{background:#2c353c;border-color:var(--acc2);color:#fff}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;transition:border-color .15s}
  .card:hover{border-color:var(--line2)}
  
  .card > .card-head{
    display:flex;align-items:center;gap:9px;padding:10px 13px;
    background:#1b2126;border-bottom:1px solid var(--line);
    color:var(--txt2);font-size:12.5px;font-weight:600;letter-spacing:.3px;
    cursor:pointer;user-select:none;transition:background .14s ease, color .14s ease;
  }
  .card > .card-head:hover{background:#232b31;color:#fff}
  .card > .card-head .ic{
    width:26px;height:26px;flex:0 0 26px;border-radius:6px;background:var(--acc-soft);
    color:var(--acc-hi);display:flex;align-items:center;justify-content:center;border:1px solid #2c433e;
    font-size:12.5px;
  }
  .card > .card-head .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card > .card-head .badge{
    font-size:10px;font-weight:600;color:var(--muted);background:#14191d;
    padding:2px 7px;border-radius:10px;border:1px solid var(--line);
  }
  .card > .card-head .chevron{
    width:16px;height:16px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);transition:transform .2s ease;font-size:10px;
  }
  .card.collapsed > .card-head{border-bottom:0}
  .card.collapsed > .card-head .chevron{transform:rotate(-90deg)}
  .card > .card-body{padding:12px 13px}
  .card.collapsed > .card-body{display:none}

  /* ---------------- NÚT BẤM DẠNG ACTION TILE (BỎ MÃ LỆNH TẮT) ---------------- */
  .btns{
    display:grid;grid-template-columns:repeat(2, 1fr);gap:8px;
  }
  @media (max-width:440px){.btns{grid-template-columns:1fr}}

  button.b.tile{
    width:100%;min-height:50px;padding:8px 10px;border-radius:8px;
    display:flex;align-items:center;text-align:left;gap:9px;
    background:#1f272c;border:1px solid #303b44;color:var(--txt2);
    cursor:pointer;position:relative;transition:all .14s ease;
    box-shadow:0 1px 3px rgba(0,0,0,.22);
  }
  button.b.tile:hover{
    background:#273238;border-color:var(--acc);transform:translateY(-1px);
    box-shadow:0 3px 8px rgba(0,0,0,.35);
  }
  button.b.tile.pri{
    background:linear-gradient(135deg, #264b43, #1c3631);
    border-color:#488e80;
  }
  button.b.tile.pri:hover{
    background:linear-gradient(135deg, #305e54, #24463f);
    border-color:var(--acc-hi);
  }
  button.b.tile.danger{
    background:#2d1b1b;border-color:#683636;color:#f0b4b4;
  }
  button.b.tile.danger:hover{
    background:#3d2323;border-color:#994949;color:#ffebeb;
  }
  button.b.tile.warn{
    background:#2e261a;border-color:#5c4c2a;color:#dfc79b;
  }
  button.b.tile.warn:hover{
    background:#3d3221;border-color:#806835;
  }
  button.b.tile.gho{
    background:#1c2227;border-color:#2a333a;color:var(--muted);
  }
  button.b.tile.gho:hover{
    background:#232a30;border-color:#3f4d56;color:var(--txt);
  }

  button.b.tile .tile-ic{
    width:32px;height:32px;flex:0 0 32px;border-radius:7px;
    background:#151a1e;border:1px solid #2b353d;
    display:flex;align-items:center;justify-content:center;
    color:var(--acc-hi);font-size:14px;transition:.14s;
  }
  button.b.tile:hover .tile-ic{
    background:var(--acc-soft);border-color:var(--acc);color:#fff;
  }
  button.b.tile.pri .tile-ic{
    background:#2b544b;border-color:#5a9f91;color:#d5faf1;
  }
  button.b.tile .tile-tx{
    flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;
  }
  button.b.tile .tile-title{
    font-size:12px;font-weight:600;color:#e3e9ec;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  button.b.tile.pri .tile-title{
    color:#eafbf6;font-weight:700;
  }
  button.b.tile .tile-desc{
    font-size:10.5px;color:var(--muted);line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  button.b.tile:hover .tile-desc{
    color:#aebdc3;
  }
  button.b.tile.star::after{
    content:'★';position:absolute;top:4px;right:6px;font-size:10.5px;color:var(--warn);
  }

  /* Nút phụ / Nút chân trang */
  .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
  .foot button.b{
    border:1px solid var(--line2);border-radius:7px;padding:6px 12px;
    background:#222a2f;color:var(--txt);font-size:11.5px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:.13s;
  }
  .foot button.b:hover{background:#2a343b;border-color:var(--acc2);color:#fff}

  .row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .row label{flex:1;color:var(--muted);font-size:12px}
  .row input[type=text]{
    width:170px;background:var(--panel2);border:1px solid var(--line2);
    border-radius:7px;padding:8px 10px;color:var(--txt);font:inherit;outline:none;transition:.13s;
  }
  .row input:focus{border-color:var(--acc2)}

  .radios{display:flex;gap:24px;align-items:center}
  .radios label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--txt)}
  .radios input{accent-color:var(--acc);width:14px;height:14px}

  /* ---------------- BẢNG ---------------- */
  .tbar{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .tbar input{
    flex:1;min-width:60px;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;
    padding:6px 9px;color:var(--txt);font:inherit;font-size:11.5px;outline:none;
  }
  .tbar input:focus{border-color:var(--acc2)}
  .tbar .cnt{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .tbl{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
  .tbl .h{display:flex;background:#232a2f;border-bottom:1px solid var(--line)}
  .tbl .h div{
    flex:1;padding:8px 9px;font-size:11px;font-weight:600;color:var(--acc-hi);cursor:pointer;
    border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:4px;transition:.13s;
  }
  .tbl .h div:hover{background:#2a3339}
  .tbl .h div:last-child{border-right:0}
  .tbl .h .ar{font-size:9px;opacity:.85}
  .tbl .rows{height:220px;overflow:auto}
  .tbl .rows .r{display:flex;border-bottom:1px solid #232a2f;font-size:12px}
  .tbl .rows .r:nth-child(even){background:rgba(255,255,255,.018)}
  .tbl .rows .r:hover{background:#26302e}
  .tbl .rows .r div{flex:1;padding:6px 9px;border-right:1px solid #232a2f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{padding:24px;text-align:center;color:var(--muted);font-size:12px}

  .note{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.65}
  /* --- bang ban quyen / cap nhat --- */
  .lic{display:flex;flex-direction:column;gap:10px}
  .licrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
  .licrow label{min-width:96px;color:var(--muted);font-size:11px}
  .licrow code{background:#1a2025;border:1px solid #2a333a;border-radius:6px;
               padding:5px 9px;font-size:12.5px;letter-spacing:.6px;user-select:all}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:4px 10px;border-radius:999px}
  .pill.ok  {background:#15351f;color:#68d391;border:1px solid #2c5c3a}
  .pill.warn{background:#3a3016;color:#e5c07b;border:1px solid #5f4d20}
  .pill.bad {background:#3a1c1c;color:#f08a8a;border:1px solid #5f2b2b}
  .licnote{font-size:11px;color:var(--muted);line-height:1.7}
  .licnote.ok {color:#8fd6a6}
  .licnote.bad{color:#f0a0a0}
  .licnote.warn2{color:#e5c07b}
  .licnote code{background:#1a2025;padding:1px 5px;border-radius:4px}
  .lichr{height:1px;background:#242c33;margin:4px 0}
  .dim{color:var(--muted);font-size:11px}
  .note b{color:var(--acc-hi);font-weight:600}
  .todo{border:1px dashed var(--line2);border-radius:8px;padding:13px;color:var(--muted);font-size:11.5px;text-align:center}

  /* ---------------- TOOLTIP MINH HỌA ---------------- */
  .tip{
    position:fixed;z-index:70;width:270px;background:#20272c;border:1px solid var(--line2);
    border-radius:9px;padding:0;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden;
    pointer-events:none;
  }
  .tip.on{display:block}
  .tip .pic{background:#171b1f;border-bottom:1px solid var(--line);display:block;width:100%}
  .tip .pic img{width:100%;display:block}
  .tip .tx{padding:9px 11px}
  .tip .tx h4{margin:0 0 4px;font-size:12px;color:var(--txt2);font-weight:600;display:flex;align-items:center;gap:6px}
  .tip .tx code{background:#2a3339;border-radius:4px;padding:1px 6px;font-size:10px;color:var(--acc-hi)}
  .tip .tx p{margin:0;font-size:11px;color:var(--muted);line-height:1.55}

  /* ---------------- TÌM LỆNH NHANH (CTRL + K) ---------------- */
  .veil{position:fixed;inset:0;background:rgba(10,13,15,.7);display:none;z-index:50}
  .veil.on{display:block}
  .finder{
    position:fixed;left:50%;top:13%;transform:translateX(-50%);width:min(560px,88vw);z-index:51;
    background:var(--panel);border:1px solid var(--line2);border-radius:11px;
    box-shadow:0 18px 50px rgba(0,0,0,.6);display:none;overflow:hidden;
  }
  .finder.on{display:block}
  .finder input{
    width:100%;border:0;background:transparent;color:var(--txt2);font:inherit;font-size:14.5px;
    padding:14px 17px;outline:none;border-bottom:1px solid var(--line);
  }
  .finder .res{max-height:330px;overflow:auto}
  .finder .it{display:flex;align-items:center;gap:9px;padding:9px 15px;cursor:pointer;font-size:12.5px}
  .finder .it .cmd{margin-left:auto;font-size:10.5px;color:var(--acc-hi);background:#2a3339;padding:2px 7px;border-radius:5px}
  .finder .it .grp{font-size:10px;color:var(--muted)}
  .finder .it.sel,.finder .it:hover{background:var(--acc-soft)}
  .finder .hint{padding:7px 15px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--line)}

  .toast{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    background:#232c2a;border:1px solid var(--acc2);border-radius:8px;
    padding:8px 15px;font-size:12px;opacity:0;transition:.22s;pointer-events:none;z-index:80;color:var(--txt);
  }
  .toast.on{opacity:1}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#333c42;border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:var(--acc2)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---- CHÍNH VẼ : bảng chọn hệ ống & cỡ ống ---- */
  .pk{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px}
  .pk button{
    background:var(--panel2);border:1px solid var(--line2);border-radius:8px;
    padding:7px 13px;color:var(--txt);font:inherit;font-size:12px;cursor:pointer;transition:.13s;
  }
  .pk button:hover{border-color:var(--acc2)}
  .pk button.on{background:#2f4d47;border-color:var(--acc-hi);color:#d8f2eb;font-weight:600}
  .pk input{
    width:82px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;
    padding:7px 9px;color:var(--txt);font:inherit;font-size:12px;outline:none;
  }
  .pk input:focus{border-color:var(--acc2)}
  .pklb{color:var(--muted);font-size:11px;letter-spacing:.4px;margin:10px 0 5px}
  .pku{color:var(--muted);font-size:11px;align-self:center;margin-left:4px}
  .pkgo{
    width:100%;margin-top:6px;padding:12px;border-radius:9px;cursor:pointer;
    background:linear-gradient(180deg,#3d6a61,#2c4f48);border:1px solid var(--acc-hi);
    color:#e6fbf5;font:inherit;font-size:13.5px;font-weight:700;letter-spacing:.5px;transition:.13s;
  }
  .pkgo:hover{background:linear-gradient(180deg,#478076,#335c53)}
  .pkgo small{display:block;font-weight:400;font-size:10.5px;opacity:.8;margin-top:2px;letter-spacing:0}

  /* ---------------- RESPONSIVE DOCK PALETTE ---------------- */
  @media (max-width: 520px){
    .grid{grid-template-columns:1fr !important}
    .side{width:56px !important;flex-basis:56px !important}
    .side .brand h1,.side .brand p,.side .cat,.side .nav button span.lb,.side .side-foot .lbl,.side .ver{display:none}
    .side .logo{width:38px;height:38px}
    .side .nav button{justify-content:center;padding:10px 0}
    .row input[type=text]{width:120px}
    .btns{grid-template-columns:1fr !important}
  }

  /* ---------------- GIAO DIỆN SPEC VIEWER ---------------- */
  .spec-box{display:flex;flex-direction:column;gap:12px}
  .spec-subnav{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .spec-subnav button{
    background:#1e2429;border:1px solid var(--line2);color:var(--muted);
    padding:6px 12px;border-radius:7px;cursor:pointer;font:inherit;font-size:11.5px;
    font-weight:500;transition:.12s;display:flex;align-items:center;gap:6px;
  }
  .spec-subnav button:hover{background:#283138;color:var(--txt)}
  .spec-subnav button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-hi);font-weight:600}
  .spec-header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
  .spec-title{font-size:13px;font-weight:600;color:var(--txt2)}
  .spec-desc{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5}
  .spec-search{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .spec-search input{
    flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;
    padding:6px 10px;color:var(--txt);font:inherit;font-size:11.5px;outline:none;
  }
  .spec-search input:focus{border-color:var(--acc2)}
  .spec-badge{
    display:inline-block;padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:600;
  }
  .spec-badge.ctn{background:#172e3b;color:#70c0e8;border:1px solid #234c63}
  .spec-badge.dien{background:#3b3617;color:#e8d170;border:1px solid #635723}
  .spec-badge.hvac{background:#173b2b;color:#70e8b1;border:1px solid #236345}
  .spec-badge.pccc{background:#3b1717;color:#e87070;border:1px solid #632323}
</style>
</head>
<body>

<script>
/* =======================================================================
   1. GIAO TIẾP VỚI AUTOCAD (C# WebView2 Host)
   ======================================================================= */
const host = window.chrome && window.chrome.webview;
function send(obj){ if(host) host.postMessage(obj); }
function run(cmd, btn){
  send({action:'run', command:cmd});
  pushRecent(cmd);
  if(btn){
    btn.classList.add('fired');
    setTimeout(()=>btn.classList.remove('fired'), 220);
  }
}
function setCfg(k,v){ send({action:'set', key:k, value:String(v)}); }

let LIC = {trang:'ChuaKichHoat', mota:'Chưa kích hoạt',
           khach:'', ma:'', mamay:'', ngayconlai:0, vinhvien:false,
           saphethan:false, quyen:[]};
let CAPNHAT = {trangthai:'', phienban:'', ghichu:[], mota:'', loi:'', treo:false};

let _hen = null;
function canhBaoTreo(){
  if(_hen) clearTimeout(_hen);
  _hen = setTimeout(function(){
    if(CAPNHAT.trangthai === 'dangkiem' || CAPNHAT.trangthai === 'dangtai'){
      CAPNHAT.treo = true; repaintLic();
    }
  }, 40000);
}

function licHtml(){
  const t = LIC.trang;
  const mau = (t==='HopLe') ? (LIC.saphethan ? 'warn' : 'ok') : 'bad';
  const nhan = {HopLe: LIC.saphethan ? 'SẮP HẾT HẠN' : 'ĐÃ KÍCH HOẠT',
                HetHan:'HẾT HẠN — ĐÃ KHOÁ',
                SaiMay:'KHÔNG KHỚP MÁY',
                HongFile:'FILE BẢN QUYỀN LỖI',
                DaThayThe:'FILE CŨ — ĐÃ BỊ THAY THẾ',
                ChuaKichHoat:'CHƯA KÍCH HOẠT'}[t] || t;

  const chan = (t !== 'HopLe') ? `
    <div class="licnote bad"><b>Phần mềm đang bị khoá.</b>
      Toàn bộ lệnh vẽ và bóc khối lượng chưa nạp.
      Kích hoạt xong là dùng được ngay, không phải khởi động lại AutoCAD.</div>` : '';

  const sap = (t === 'HopLe' && LIC.saphethan) ? `
    <div class="licnote warn2">Còn <b>${LIC.ngayconlai} ngày</b>.
      Liên hệ tác giả để gia hạn trước khi bị khoá.</div>` : '';

  const cn = CAPNHAT.trangthai;
  let cnHtml = '';
  if(cn==='dangkiem')      cnHtml = `<div class="licnote">Đang kiểm tra…</div>`
      + (CAPNHAT.treo ? `<div class="licnote bad">Quá lâu không có phản hồi.
          Gõ <b>MMCAPNHATLOG</b> ở dòng lệnh AutoCAD để xem kẹt ở bước nào.</div>` : '');
  else if(cn==='dangtai')  cnHtml = `<div class="licnote">Đang tải bản mới…</div>`;
  else if(cn==='moinhat')  cnHtml = `<div class="licnote">Đang dùng bản mới nhất.${
      CAPNHAT.loi ? ' <span class="dim">('+esc(CAPNHAT.loi)+')</span>' : ''}</div>`;
  else if(cn==='loi')      cnHtml = `<div class="licnote bad">${esc(CAPNHAT.loi)}</div>`;
  else if(cn==='xong')     cnHtml = `<div class="licnote ok">${esc(CAPNHAT.mota)}</div>`;
  else if(cn==='comoi')    cnHtml = `
      <div class="licnote ok"><b>Có bản mới ${esc(CAPNHAT.phienban)}</b>
        ${CAPNHAT.ghichu.map(g=>`<div>▸ ${esc(g)}</div>`).join('')}
      </div>
      <button class="b pri" onclick="send({action:'capnhat-caidat'});
        CAPNHAT.trangthai='dangtai';repaintLic()">Cài bản mới</button>`;

  return `
  <div class="lic">
    <div class="licrow">
      <span class="pill ${mau}">${nhan}</span>
      <span class="dim">${esc(LIC.mota)}</span>
    </div>
    ${chan}${sap}

    ${LIC.khach ? `<div class="licrow"><label>Khách hàng</label>
        <span>${esc(LIC.khach)}${LIC.ma?' · '+esc(LIC.ma):''}</span></div>` : ''}

    <div class="licrow">
      <label>Mã máy này</label>
      <code id="mamay">${esc(LIC.mamay||'—')}</code>
      <button class="b sm gho" onclick="copyMaMay()">Copy</button>
    </div>
    <div class="licnote">Gửi <b>mã máy</b> ở trên cho tác giả qua Zalo để nhận file
      bản quyền <code>.lic</code>, rồi bấm nút dưới đây và trỏ vào file đó.</div>

    <div class="btns" style="grid-template-columns:1fr 1fr">
      <button class="b tile pri" onclick="send({action:'lic-chonfile'})">
        <div class="tile-ic">${ico('shield')}</div>
        <div class="tile-tx"><div class="tile-title">Kích hoạt bản quyền</div><div class="tile-desc">Chọn file .lic đã cấp</div></div>
      </button>
      <button class="b tile gho" onclick="send({action:'lic-trangthai'})">
        <div class="tile-ic">${ico('reload')}</div>
        <div class="tile-tx"><div class="tile-title">Kiểm tra lại</div><div class="tile-desc">Làm mới trạng thái bản quyền</div></div>
      </button>
    </div>

    <div class="lichr"></div>

    <div class="licrow"><label>Phiên bản</label><span id="licver">—</span></div>
    <div class="btns" style="grid-template-columns:1fr 1fr">
      <button class="b tile gho" onclick="send({action:'capnhat-kiemtra'});
        CAPNHAT.trangthai='dangkiem';CAPNHAT.treo=false;repaintLic();canhBaoTreo()">
        <div class="tile-ic">${ico('reload')}</div>
        <div class="tile-tx"><div class="tile-title">Kiểm tra cập nhật</div><div class="tile-desc">Dò tìm bản phát hành mới</div></div>
      </button>
      <button class="b tile gho" onclick="send({action:'capnhat-quaylui'})">
        <div class="tile-ic">${ico('swap')}</div>
        <div class="tile-tx"><div class="tile-title">Quay về bản trước</div><div class="tile-desc">Phục hồi phiên bản ổn định cũ</div></div>
      </button>
    </div>
    ${cnHtml}
  </div>`;
}

function repaintLic(){
  const el = document.querySelector('.lic');
  if(el) el.outerHTML = licHtml();
  const v = document.getElementById('licver');
  if(v && window.__VER) v.textContent = window.__VER;
}

function copyMaMay(){
  try{ navigator.clipboard.writeText(LIC.mamay||''); toast('Đã copy mã máy — dán vào Zalo gửi tác giả'); }
  catch(e){ toast('Không copy được, anh bôi đen rồi Ctrl+C'); }
}

if(host){
  host.addEventListener('message', e=>{
    const m = e.data || {};
    if(m.channel === 'info' && m.data){
      window.__VER = m.data.version || '';
      document.getElementById('topbar').textContent =
        'CT TOOLS ' + (m.data.version?('v'+m.data.version+' '):'') + '· AutoCAD ' + (m.data.cad||'');
    }
    else if(m.channel === 'license' && m.data){ LIC = m.data; repaintLic(); }
    else if(m.channel === 'capnhat' && m.data){ CAPNHAT = Object.assign({ghichu:[]}, m.data); repaintLic(); }
    else if(m.channel === 'toast'   && m.data){ toast(m.data.text||''); }
    else if(m.channel === 'spec'){
      // Tra ve null = khong doc duoc file -> giu ban de phong, bao mot cau.
      const ten = m.data && m.data.ten;
      const khoa = Object.keys(SPEC_FILE).find(k => SPEC_FILE[k] === ten);
      if(khoa){
        delete SPEC_DANGDOC[khoa];
        const dd = specTuFile(khoa, m.data);
        if(dd && dd.rows.length) SPEC_LIVE[khoa] = dd;
        if(SPEC_CUR === khoa){
          const el = document.getElementById('specBox');
          if(el) el.innerHTML = specContentHtml();
        }
      } else if(m.data === null){
        toast('Không đọc được file tiêu chuẩn trong thư mục Spec.');
      }
    }
    else if(m.channel && TABLES[m.channel]) fillTable(m.channel, m.data||[]);
  });
  send({action:'ready'});
}
let toastTimer;
function toast(t){
  const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),1700);
}
function load(k,d){ try{ const v=localStorage.getItem('ct_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem('ct_'+k, JSON.stringify(v)); }catch(e){} }
let RECENT = load('recent',[]), PINS = load('pins',[]);
function pushRecent(c){ RECENT=[c,...RECENT.filter(x=>x!==c)].slice(0,8); save('recent',RECENT); renderRecent(); }
function togglePin(c){
  PINS = PINS.includes(c) ? PINS.filter(x=>x!==c) : [...PINS,c].slice(0,10);
  save('pins',PINS); go(CUR);
  const ten = (BTN[c] && BTN[c].t) ? BTN[c].t : c;
  toast(PINS.includes(c) ? '★ Đã ghim: ' + ten : 'Đã bỏ ghim: ' + ten);
}

let tipTimer, tipEl = document.getElementById('tip');
function showTip(e, b){
  clearTimeout(tipTimer);
  tipTimer = setTimeout(()=>{
    if(!b) return;
    const pic = b.img ? `<div class="pic"><img src="${b.img}" alt=""></div>`
                      : (b.demo ? demoSvg(b.demo) : '');
    tipEl.innerHTML = pic +
      `<div class="tx"><h4>${esc(b.t)}</h4>
       <p>${b.d ? esc(b.d) : 'Thực hiện chức năng tự động trong AutoCAD.'}</p></div>`;
    tipEl.classList.add('on');
    const r = tipEl.getBoundingClientRect();
    let x = e.clientX + 16, y = e.clientY + 14;
    if(x + r.width  > innerWidth  - 8) x = e.clientX - r.width  - 12;
    if(y + r.height > innerHeight - 8) y = innerHeight - r.height - 10;
    tipEl.style.left = Math.max(8,x)+'px'; tipEl.style.top = Math.max(8,y)+'px';
  }, 330);
}
function hideTip(){ clearTimeout(tipTimer); tipEl.classList.remove('on'); }

/* =======================================================================
   4. RENDER VÀ ĐIỀU KHIỂN GIAO DIỆN
   ======================================================================= */
const TABLES = {};   // id -> {cols, rows, view, sort, dir, q}
let CUR = 'vepipe';
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ico(n,cls){ return `<svg class="i ${cls||''}"><use href="#i-${n}"/></svg>`; }

const INDEX = [];
TABS.forEach(t=>t.cards.forEach(cd=>(cd.items||[]).forEach(it=>{
  if(it.type==='btns'||it.type==='foot')
    it.b.forEach(b=>{ if(!b.an) INDEX.push({...b, g:t.name, tab:t.id}); });
})));
const BTN = {}; INDEX.forEach(b=>{ if(!BTN[b.c]) BTN[b.c]=b; });

const LOAI_CO_NOI_DUNG = ['radio','input','table','licpanel',
                          'pipecfg','pccccfg','qtcfg','traycfg','specviewer'];
function tabCoNoiDung(t){
  return (t.cards||[]).some(c =>
    hien(c.head).length ||
    (c.items||[]).some(it =>
      ((it.type==='btns'||it.type==='foot') && hien(it.b).length) ||
      LOAI_CO_NOI_DUNG.includes(it.type)));
}
const TABS_HIEN = TABS.filter(tabCoNoiDung);

function buildNav(){
  document.getElementById('nav').innerHTML = TABS_HIEN.map(t=>
    `<button data-id="${t.id}" onclick="go('${t.id}')" title="${esc(t.name)}">
       ${ico(t.icon)}<span class="lb">${esc(t.name)}</span></button>`).join('');
}

/* Rút gọn mô tả hiển thị trên thẻ Action Tile */
function shortDesc(d, t){
  if(!d) return 'Thao tác tự động trong AutoCAD';
  let s = d.replace(/<[^>]+>/g, '').trim();
  let idx = s.indexOf('.');
  if(idx > 8 && idx < 52) return s.substring(0, idx);
  if(s.length > 50) return s.substring(0, 48) + '…';
  return s;
}

/* NÚT BẤM DẠNG ACTION TILE - HOÀN TOÀN BỎ MÃ LỆNH TẮT TRÊN NÚT BẤM */
function btnHtml(b){
  const cls = 'b tile' + (b.pri?' pri':'') + (b.danger?' danger':(b.g?' gho':'')) + (b.w?' warn':'') + (PINS.includes(b.c)?' star':'');
  const ic = b.icon ? ico(b.icon) : (b.demo ? ico(b.demo) : ico('tool'));
  return `<button class="${cls}" onclick="run('${b.c}',this)"
      oncontextmenu="event.preventDefault();togglePin('${b.c}')"
      onmouseenter="showTip(event, BTN['${b.c}'])" onmousemove="if(!tipEl.classList.contains('on'))showTip(event,BTN['${b.c}'])"
      onmouseleave="hideTip()">
    <div class="tile-ic">${ic}</div>
    <div class="tile-tx">
      <div class="tile-title">${esc(b.t)}</div>
      <div class="tile-desc">${esc(shortDesc(b.d, b.t))}</div>
    </div>
  </button>`;
}

const SHOWNOTE = false;
function hien(ds){ return (ds||[]).filter(b=>!b.an); }

function itemHtml(it){
  switch(it.type){
    case 'btns': { const v=hien(it.b); return v.length?`<div class="btns">${v.map(btnHtml).join('')}</div>`:''; }
    case 'foot': { const v=hien(it.b); return v.length?`<div class="foot">${v.map(b=>`<button class="b" onclick="run('${b.c}',this)">${esc(b.t)}</button>`).join('')}</div>`:''; }
    case 'radio':
      return `<div class="radios">`+it.opts.map(([v,l])=>
        `<label><input type="radio" name="r_${it.key}" value="${v}" ${v===it.val?'checked':''}
          onchange="setCfg('${it.key}',this.value);toast('${it.key} = ${v}')"> ${esc(l)}</label>`).join('')+`</div>`;
    case 'input':
      return `<div class="row"><label>${esc(it.label)}</label>
        <input type="text" id="in_${it.key}" oninput="setCfg('${it.key}',this.value)"></div>`;
    case 'table': {
      const T = TABLES[it.id] || (TABLES[it.id] = {cols:it.cols, rows:[], sort:-1, dir:1, q:''});
      T.cols = it.cols;
      return `<div class="tbar">
          ${ico('search')}
          <input placeholder="Lọc trong bảng…" value="${esc(T.q)}" oninput="setQ('${it.id}',this.value)">
          <span class="cnt" id="cnt_${it.id}"></span>
          <button class="iconbtn" onclick="toExcel('${it.id}')" title="Xuất ra Excel">${ico('excel')}Excel</button>
          <button class="iconbtn" onclick="toClip('${it.id}')" title="Copy bảng vào clipboard">${ico('copy')}</button>
        </div>
        <div class="tbl">
          <div class="h" id="th_${it.id}"></div>
          <div class="rows" id="tb_${it.id}"></div>
        </div>`;
    }
    case 'licpanel':   return licHtml();
    case 'specviewer': return specViewerHtml();
    case 'pipecfg':    return pipeCfgHtml();
    case 'pccccfg':    return pcccCfgHtml();
    case 'qtcfg':      return qtCfgHtml();
    case 'traycfg':    return trayCfgHtml();
    case 'note': return SHOWNOTE ? `<div class="note">▸ ${it.t}</div>` : '';
    case 'todo': return SHOWNOTE ? `<div class="todo">${esc(it.t)}</div>` : '';
  }
  return '';
}

function toggleAcc(cid){
  const el = document.getElementById(cid);
  if(!el) return;
  el.classList.toggle('collapsed');
  save('acc_' + cid, el.classList.contains('collapsed') ? '1' : '0');
}

function setAllAcc(expand){
  document.querySelectorAll('.card.acc').forEach(el => {
    if(expand){
      el.classList.remove('collapsed');
      save('acc_' + el.id, '0');
    } else {
      el.classList.add('collapsed');
      save('acc_' + el.id, '1');
    }
  });
}

function cardHtml(c, idx){
  const cid = 'card_' + CUR + '_' + idx;
  const isCol = load('acc_' + cid, '0') === '1';
  const body = (c.items||[]).map(itemHtml).join('');
  const head = hien(c.head).map(b=>`<button class="iconbtn" onclick="run('${b.c}',this)">${esc(b.t)}</button>`).join('');
  
  // Đếm số nút trong card
  let btnCount = 0;
  (c.items||[]).forEach(it=>{
    if(it.type==='btns') btnCount += hien(it.b).length;
  });
  const countBadge = btnCount > 0 ? `<span class="badge">${btnCount} chức năng</span>` : '';

  const coNut = (c.items||[]).some(it=>(it.type==='btns'||it.type==='foot') && hien(it.b).length);
  const chiGhiChu = (c.items||[]).every(it=>it.type==='note'||
      ((it.type==='btns'||it.type==='foot') && !hien(it.b).length));
  if(chiGhiChu && !coNut && !head) return '';
  if(!body.trim() && !head) return '';

  return `<div class="card acc ${isCol?'collapsed':''}" id="${cid}">
      <div class="card-head" onclick="toggleAcc('${cid}')">
        <span class="ic">${ico(c.icon)}</span>
        <span class="title">${esc(c.title)}</span>
        ${head?`<span class="right" onclick="event.stopPropagation()">${head}</span>`:''}
        ${countBadge}
        <span class="chevron">▼</span>
      </div>
      <div class="card-body">
        ${body}
      </div>
    </div>`;
}

function renderRecent(){
  const el=document.getElementById('recentBar'); if(!el) return;
  const mk=(c,p)=>{
    const title = (BTN[c] && BTN[c].t) ? BTN[c].t : c;
    return `<span class="chip${p?' pin':''}" onclick="run('${c}')"
      oncontextmenu="event.preventDefault();togglePin('${c}')"
      onmouseenter="if(BTN['${c}'])showTip(event,BTN['${c}'])" onmouseleave="hideTip()">${p?'★ ':''}${esc(title)}</span>`;
  };
  const pins=PINS.filter(c=>BTN[c]).map(c=>mk(c,1)).join('');
  const recs=RECENT.filter(c=>!PINS.includes(c)&&BTN[c]).map(c=>mk(c,0)).join('');
  el.innerHTML=(pins||recs)?`<b>TRUY CẬP NHANH:</b>${pins}${recs}`:'';
}

function go(id){
  let tab=TABS_HIEN.find(t=>t.id===id);
  if(!tab) tab=TABS_HIEN[0];
  if(!tab) return;
  id=tab.id;
  CUR=id; hideTip();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.id===id));
  
  const c1=tab.cards.filter(c=>c.col!==2).map((c,i)=>cardHtml(c, 'c1_'+i)).join('');
  const c2=tab.cards.filter(c=>c.col===2).map((c,i)=>cardHtml(c, 'c2_'+i)).join('');

  const toolbarHtml = `
    <div class="acc-bar">
      <span><b>PHƯƠNG ÁN 2:</b> 4 Nhóm tác vụ chuẩn hóa · Nhấp chuột vào tiêu đề để đóng/mở</span>
      <div class="acc-bar-actions">
        <button onclick="setAllAcc(true)">▲ Mở tất cả</button>
        <button onclick="setAllAcc(false)">▼ Thu gọn</button>
      </div>
    </div>
  `;

  document.getElementById('body').innerHTML =
    `<div class="recent" id="recentBar"></div>
     ${toolbarHtml}
     <div class="grid"><div>${c1}</div><div>${c2}</div></div>`;
  renderRecent();
  tab.cards.forEach(c=>(c.items||[]).forEach(it=>{ if(it.type==='table') drawTable(it.id); }));
  document.getElementById('body').scrollTop=0;
}

/* =======================================================================
   5. BẢNG: SẮP XẾP · LỌC · XUẤT EXCEL
   ======================================================================= */
function fillTable(id, rows){
  const T = TABLES[id]; if(!T) return;
  T.rows = Array.isArray(rows) ? rows : [];
  drawTable(id);
  toast('Đã nhận ' + T.rows.length + ' dòng');
}
function setQ(id,q){ const T=TABLES[id]; if(!T) return; T.q=q; drawTable(id); }
function sortBy(id,i){
  const T=TABLES[id]; if(!T) return;
  if(T.sort===i) T.dir=-T.dir; else { T.sort=i; T.dir=1; }
  drawTable(id);
}
function num(v){ const n=parseFloat(String(v).replace(/[^\d.,-]/g,'').replace(/\.(?=.*\.)/g,'').replace(',','.')); return isNaN(n)?null:n; }
function viewOf(T){
  let v = T.rows;
  if(T.q){ const q=T.q.toLowerCase(); v = v.filter(r=>r.some(c=>String(c).toLowerCase().includes(q))); }
  if(T.sort>=0){
    const i=T.sort, d=T.dir;
    v=[...v].sort((a,b)=>{
      const x=num(a[i]), y=num(b[i]);
      if(x!==null&&y!==null) return (x-y)*d;
      return String(a[i]).localeCompare(String(b[i]),'vi')*d;
    });
  }
  return v;
}
function drawTable(id){

  if(cnt) cnt.textContent = T.rows.length ? (v.length===T.rows.length? v.length+' dòng' : v.length+'/'+T.rows.length) : '';

function toExcel(id){
  const T=TABLES[id]; if(!T||!T.rows.length){ toast('Bảng chưa có dữ liệu'); return; }
  const v=viewOf(T);
  const cell=x=>{
    const n=num(x);
    const isNum = n!==null && /^[\s\d.,-]+$/.test(String(x));
    return isNum
      ? `<Cell><Data ss:Type="Number">${n}</Data></Cell>`
      : `<Cell><Data ss:Type="String">${esc(x)}</Data></Cell>`;
  };
  const xml =
`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles><Style ss:ID="h"><Font ss:Bold="1"/>
<Interior ss:Color="#D9E7E4" ss:Pattern="Solid"/></Style></Styles>
<Worksheet ss:Name="CHINH TOOL"><Table>
<Row>${T.cols.map(c=>`<Cell ss:StyleID="h"><Data ss:Type="String">${esc(c)}</Data></Cell>`).join('')}</Row>
${v.map(r=>`<Row>${T.cols.map((_,i)=>cell(r[i])).join('')}</Row>`).join('\n')}
</Table></Worksheet></Workbook>`;
  const blob=new Blob(['\ufeff'+xml],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ChinhTool_'+id+'.xls';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Đã xuất ' + v.length + ' dòng ra Excel');
}
function toClip(id){
  const T=TABLES[id]; if(!T||!T.rows.length){ toast('Bảng chưa có dữ liệu'); return; }
  const v=viewOf(T);
  const txt=[T.cols.join('\t'), ...v.map(r=>T.cols.map((_,i)=>r[i]).join('\t'))].join('\n');
  try{ navigator.clipboard.writeText(txt); toast('Đã copy '+v.length+' dòng — dán thẳng vào Excel'); }
  catch(e){ toast('Không copy được, hãy dùng nút Excel'); }
}

/* =======================================================================
   6. TÌM LỆNH NHANH (CTRL + K)
   ======================================================================= */
function toggleSide(){ document.getElementById('side').classList.toggle('mini'); }
let fsel=0, fhits=[];
function openFinder(){
  document.getElementById('veil').classList.add('on');
  document.getElementById('finder').classList.add('on');
  const q=document.getElementById('fq'); q.value=''; q.focus(); filterFinder('');
}
function closeFinder(){
  document.getElementById('veil').classList.remove('on');
  document.getElementById('finder').classList.remove('on');
}
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u0111/g,'d'); }
function filterFinder(q){
  const n=norm(q);
  fhits=(n?INDEX.filter(x=>norm(x.t).includes(n)||norm(x.c).includes(n)||norm(x.g).includes(n)):INDEX).slice(0,40);
  fsel=0; drawFinder();
}
function drawFinder(){
  document.getElementById('fres').innerHTML = fhits.length
    ? fhits.map((x,i)=>`<div class="it ${i===fsel?'sel':''}" onclick="pick(${i})">
        <span>${esc(x.t)}</span><span class="grp">· ${esc(x.g)}</span><span class="cmd">${x.c}</span></div>`).join('')
    : '<div class="empty">Không tìm thấy lệnh nào</div>';
}
function pick(i){ const h=fhits[i]; if(!h) return; closeFinder(); go(h.tab); run(h.c); }
document.getElementById('fq').addEventListener('input', e=>filterFinder(e.target.value));
document.addEventListener('keydown', e=>{
  const open=document.getElementById('finder').classList.contains('on');
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); open?closeFinder():openFinder(); return; }
  if(!open) return;
  if(e.key==='Escape') closeFinder();
  else if(e.key==='ArrowDown'){ e.preventDefault(); fsel=Math.min(fsel+1,fhits.length-1); drawFinder(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); fsel=Math.max(fsel-1,0); drawFinder(); }
  else if(e.key==='Enter'){ e.preventDefault(); const h=fhits[fsel]; if(!h) return;
    if(e.ctrlKey) togglePin(h.c); else pick(fsel); }
});

   file JSON thi bang tra khong doi, va khong ai biet la no da lech.

   Khong fetch() thang duoc: virtual host chi anh xa thu muc ui\, ma anh xa

   WebMessage san co (action 'spec' -> PaletteHost.DocSpec).

   ========================================================================== */

const SPEC_DANGDOC = {};

/* Trai mot object JSON long nhau thanh cac dong [Muc, Gia tri, Ghi chu]. */
function specTrai(o, duong, rows){
  if(o === null || o === undefined) return;
  if(Array.isArray(o)){
    o.forEach((v,i)=>{
      if(v && typeof v === 'object') specTrai(v, duong, rows);
      else rows.push([duong, String(v), '']);
    });
    return;
  }
  if(typeof o === 'object'){
    const con = {};
    let coCon = false;
    for(const k in o){
      const v = o[k];
      if(v && typeof v === 'object'){ specTrai(v, duong ? duong+' › '+k : k, rows); }
      else { con[k] = v; coCon = true; }
    }
    if(coCon){
      const ten = Object.keys(con).map(k=>k+': '+con[k]).join('  |  ');
      rows.push([duong || '(gốc)', ten, '']);
    }
    return;
  }
  rows.push([duong, String(o), '']);
}

/* Doi noi dung file that thanh dung dang {title, desc, cols, rows} ma bo
   hien thi san co dang dung - khong phai viet lai bo hien thi. */
function specTuFile(khoa, d){
  if(!d) return null;
  if(d.csv !== undefined){
    const dong = String(d.csv).split(/\r?\n/).filter(x=>x.trim().length);
    if(!dong.length) return null;
    const tach = x => x.split(x.indexOf(';')>=0 ? ';' : ',');
    const cols = tach(dong[0]);
    return {
      title: 'ĐƠN GIÁ VẬT TƯ  (' + d.ten + ')',
      desc:  'Đọc trực tiếp từ ' + d.ten + ' trong thư mục Spec. Sửa file là bảng này đổi theo.',
      cols:  cols,
      rows:  dong.slice(1).map(tach)
    };
  }
  const j = d.json;
  if(!j) return null;
  const rows = [];
  for(const k in j){
    if(k==='TieuChuan'||k==='PhienBan'||k==='GhiChu'||k==='meta') continue;
    specTrai(j[k], k, rows);
  }
  return {
    title: (j.TieuChuan || khoa.toUpperCase()) + '  (' + d.ten + ')',
    desc:  (j.GhiChu || 'Đọc trực tiếp từ ' + d.ten + ' trong thư mục Spec.') +
           (j.PhienBan ? '  — phiên bản ' + j.PhienBan : ''),
    cols:  ['Mục', 'Giá trị', 'Ghi chú'],
    rows:  rows
  };
}

/* Du lieu dang dung cho tab hien hanh: uu tien file that. */
function specData(){
  return SPEC_LIVE[SPEC_CUR] || SPEC_DATA[SPEC_CUR] || null;

/* Xin file tu phia AutoCAD. */
function specXinFile(k){
  if(SPEC_LIVE[k] || SPEC_DANGDOC[k] || !SPEC_FILE[k] || !host) return;
  SPEC_DANGDOC[k] = 1;
  send({action:'spec', ten:SPEC_FILE[k]});
}

function specSetTab(k){
  SPEC_CUR = k;
  const navs = document.querySelectorAll('.spec-subnav button');
  navs.forEach(b => b.classList.remove('on'));
  const btn = document.querySelector(`.spec-subnav button[data-k="${k}"]`);
  if(btn) btn.classList.add('on');
  const el = document.getElementById('specBox');
  if(el) el.innerHTML = specContentHtml();
}

function specSetQ(q){
  SPEC_Q = (q||'').trim().toLowerCase();
  const el = document.getElementById('specTableBody');
  if(el) el.innerHTML = specRowsHtml();
}

function specRowsHtml(){
  const d = specData();
  if(!d) return '';
  let rows = d.rows;
  if(SPEC_Q){
    rows = rows.filter(r => r.some(c => String(c).toLowerCase().includes(SPEC_Q)));
  }
  if(!rows.length) return `<div class="empty">Không tìm thấy mục nào khớp với "${esc(SPEC_Q)}"</div>`;
  return rows.map(r =>
    `<div class="r">${r.map(c => `<div>${esc(c)}</div>`).join('')}</div>`
  ).join('');
}

function specContentHtml(){
  specXinFile(SPEC_CUR);
  const d = specData();
  if(!d) return '';
  const headCols = d.cols.map(c => `<div>${esc(c)}</div>`).join('');
  return `
    <div class="spec-header">
      <div class="spec-title">${esc(d.title)}</div>
      <button class="iconbtn" onclick="specCopy()" title="Copy bảng này vào clipboard">${ico('copy')} Copy bảng</button>
    </div>
    <div class="spec-desc">${esc(d.desc)}</div>
    <div class="spec-search">
      ${ico('search')}
      <input id="specQIn" placeholder="Tìm kiếm nhanh trong bảng tiêu chuẩn…" value="${esc(SPEC_Q)}" oninput="specSetQ(this.value)">
      <span class="cnt">${d.rows.length} mục</span>
    </div>
    <div class="tbl">
      <div class="h">${headCols}</div>
      <div class="rows" id="specTableBody" style="height:280px">${specRowsHtml()}</div>
    </div>
  `;
}

function specCopy(){
  const d = specData();
  if(!d || !d.rows.length) return;
  const txt = [d.cols.join('\t'), ...d.rows.map(r=>r.join('\t'))].join('\n');
  try{ navigator.clipboard.writeText(txt); toast('Đã copy bảng tiêu chuẩn vào clipboard'); }
  catch(e){ toast('Không thể copy bảng'); }
}
